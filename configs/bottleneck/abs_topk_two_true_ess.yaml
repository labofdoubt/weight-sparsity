# abs_topk + two-sided ess calibration, exact LapSum gradient weights
# one_sided_weight_mode is not consulted here: the cancellation that
# motivates score_softmax is a one-sided construction.
_base_: base.yaml

activation_bottleneck:
  selection_mode: abs_topk
  boundary_mode: both_sides
  one_sided_weight_mode: true_gradient
  effective_count_metric: ess
