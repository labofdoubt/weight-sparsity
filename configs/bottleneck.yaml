_base_:
  - model/small.yaml
  - train/default.yaml

train:
  run_name: bottleneck_small

activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32
  j: 480
  selection_mode: abs_topk
  surrogate_mode: lapsum
  temperature: 1.0
  # stream placement: see the note in bn_lapsum.yaml
  init_mode: sqrt_k_selection_corrected
