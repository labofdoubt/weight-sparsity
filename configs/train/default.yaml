data:
  dataset: roneneldan/TinyStories
  data_dir: data/tinystories
  tokenizer: gpt_neo        # or: bpe (trains an 8k byte-level BPE on TinyStories)
  seq_len: 512

train:
  optimizer: adamw
  lr: 6.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0

  lr_schedule: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1

  batch_size: 64            # sequences per optimiser step
  micro_batch_size: 16      # gradient accumulation = 64 / 16 = 4

  max_steps: 20000
  log_every_steps: 20
  validate_every_steps: 500
  val_batches: 40
  checkpoint_every_steps: 2000
  keep_last_checkpoints: 3
  sample_every_steps: 0

  seed: 1337
  device: auto
  dtype: bfloat16
  compile: false
  out_dir: runs
  run_name: default
