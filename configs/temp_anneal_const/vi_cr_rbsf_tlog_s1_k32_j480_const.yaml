# vi_cr_rbsf_tlog_s1_k32_j480_const: soft RBLapSum (rank boundary b = max(b0, s_(K+1))) with the probabilities in the
# forward, y_i = z_i p_i over the Top(K+J) pool, K = 32, J = 480, and a log-schedule
# temperature anneal, s_0 = 1:
#   T(s) = T_f + (T_0 - T_f) (1 - f(s)),  f(s) = ln(1 + s/s_0) / ln(1 + S/s_0),
# T_0 = 1 -> T_f = 0.01 over the first S = 18000 steps (temperature_annealing_steps),
# T_f for the last 2000.  Validation: val/ce hard Top-K, val_soft/ce the soft forward
# at T(s), val_topk/ce and val_topkj/ce hard Top-K and Top-(K+J) (as under
# hard_k_annealing).
#
# configs/hard_k_anneal_const/ta_cr_hard_k32_const.yaml (code-carried, no post-norm,
# constant LR 6e-4, 20k steps) with
#   activation_bottleneck.surrogate_mode: hard -> rblapsum_sf, j: 64 -> 480
#   activation_bottleneck.temperature: 1.0 (T_0), temperature_annealing: true,
#   temperature_annealing_final: 0.01, temperature_annealing_schedule: log,
#   temperature_annealing_s0: 1, temperature_annealing_steps: 18000
#   activation_bottleneck.rblapsum_boundary_grad_mode: detach -> through_rank_kappa
#     (the rblapsum_sf default; the base config pins the hard-mode value)
#   train.run_name
# Compare: vi_cr_klog_s1_k32_j480_const (log K-annealing, s_0 = 1, same S), and the
# hard baselines ta_cr_hard_k<K>_const (runs_tallinn).
model:
  vocab_size: 50257
  max_seq_len: 512
  n_layers: 8
  d_model: 768
  n_heads: 12
  mlp_ratio: 4.0
  mlp_activation: gelu
  dropout: 0.0
  attn_dropout: 0.0
  bias: false
  norm_eps: 1.0e-06
  tie_embeddings: true
  pos_encoding: rope
  rope_theta: 10000.0
  decouple: true
  decouple_gains: row_col
  bottleneck_init: standard
  bottleneck_decoder_scale: none
  md_init: false
  init_scheme: fixed_std
  init_std: 0.02
  init_gain: 1.0
  init_std_embedding: null
  init_std_pos: null
  init_std_unembedding: null
  init_scale_residual: true
  logit_scale: none
data:
  dataset: roneneldan/TinyStories
  data_dir: /workspace/data/tinystories
  seq_len: 512
  tokenizer: gpt_neo
  tokenizer_path: data/tinystories/tokenizer
  bpe_vocab_size: 8192
  bpe_train_docs: 200000
  num_proc: 8
  val_fraction: 0.0
train:
  optimizer: adamw
  lr: 0.0006
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  grad_clip: 1.0
  lr_schedule: constant
  warmup_steps: 0
  min_lr_ratio: 0.1
  batch_size: 96
  final_val_batches: 0
  micro_batch_size: 24
  max_steps: 20000
  log_every_steps: 20
  validate_every_steps: 500
  val_batches: 40
  checkpoint_every_steps: 2000
  keep_last_checkpoints: 10
  sample_every_steps: 2000
  sample_prompt: Once upon a time
  sample_tokens: 96
  sample_count: 4
  seed: 1337
  device: auto
  dtype: bfloat16
  compile: false
  out_dir: /workspace/runs
  run_name: vi_cr_rbsf_tlog_s1_k32_j480_const
  resume: ''
  wandb_project: ''
  wandb_entity: ''
  tensorboard: true
activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32
  j: 480
  selection_mode: abs_topk
  surrogate_mode: rblapsum_sf
  temperature: 1.0
  temperature_annealing: true
  temperature_annealing_final: 0.01
  temperature_annealing_schedule: log
  temperature_annealing_s0: 1
  temperature_annealing_steps: 18000
  rblapsum_boundary_grad_mode: through_rank_kappa
  rblapsum_support_scale: 1.0
  rblapsum_rho_random_perm_prob_grad: 0.0
  rblapsum_surrogate_scope: pool
  rblapsum_relative_temperature: false
  rblapsum_center_tokens: false
  rblapsum_sf_value_grad: pool
  post_norm: false
  rblapsum_boundary_floor: 0.0
  init_mode: default
  tie_encoder_decoder: false
  share_projections: false
  value_shift: none
  value_shift_lambda: null
  code_residual: true
  code_residual_scale: 1.0
  barrier_solver_tol: 1.0e-06
  solver_dtype: float32
  log_diagnostics: true
  bias: false
  hard_inference: true
