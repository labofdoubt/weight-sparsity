# dust_sigma search x dust_target, 2026-10-22 (georgia): the K=32 code-carried
# hard model with the DUST bottleneck optimization (ga_cr_dust_k32_j480_p128_sep.yaml:
# J=480, population 128 = 8 x 16 draws, separate optimizer sharing the MD gains,
# chunk 4, cosine every 50 DUST steps), schedule [6, 1] (one DUST step in seven,
# about 5.2x the hard run's time per step), dust_target backprop, dust_sigma 0.03.
# Trained for 10k steps of an unchanged 20k-step LR schedule
# (scripts/train_guard.py --stop-step 10000).  Grid: target in {encoder, backprop}
# x sigma in {0.03, 0.1, 0.3, 0.9}, eight runs ga_cr_dust_k32_j480_p128_s61_*.
_base_:
  - ga_cr_dust_k32_j480_p128_sep.yaml

train:
  run_name: ga_cr_dust_k32_j480_p128_s61_bp_sg0p03

activation_bottleneck:
  dust_schedule: [6, 1]
  dust_target: backprop
  dust_sigma: 0.03
