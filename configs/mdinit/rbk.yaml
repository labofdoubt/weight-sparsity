# Family 2: RBLapSum through_rank_kappa (the rout_rblapsum_kappa family),
# fixed absolute T=1.0, boundary floor 0.1.
_base_: common.yaml

activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32          # overridden per job
  j: 480         # overridden per job
  selection_mode: abs_topk
  surrogate_mode: rblapsum
  rblapsum_boundary_grad_mode: through_rank_kappa
  rblapsum_boundary_floor: 0.1
  temperature: 1.0
  hard_inference: true
