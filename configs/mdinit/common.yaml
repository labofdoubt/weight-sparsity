# MD-vs-MD-init comparison campaign (california, 2026-09).
#
# Isolates whether the advantage of magnitude-direction decoupling comes from
# the optimizer (norm constraint + gains) or from its initialization: each
# family runs decouple=True against md_init=True (same init bit for bit, plain
# AdamW) at weight_decay 0.1 and 0.01.
#
# Model/train mirror the uk campaign runs (runs_uk/*/config.json) exactly:
# 8x768, rope, tied embeddings, batch 96, 20k steps.  Per-run k/j and the
# regime flags (model.decouple / model.md_init, train.weight_decay) are
# supplied as overrides by the job file.
model:
  max_seq_len: 512
  n_layers: 8
  d_model: 768
  n_heads: 12
  mlp_ratio: 4.0
  mlp_activation: gelu
  bias: false
  tie_embeddings: true
  pos_encoding: rope
  logit_scale: none

data:
  dataset: roneneldan/TinyStories
  data_dir: data/tinystories
  tokenizer: gpt_neo
  seq_len: 512

train:
  optimizer: adamw
  lr: 6.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  lr_schedule: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1
  batch_size: 96
  micro_batch_size: 24
  max_steps: 20000
  log_every_steps: 20
  validate_every_steps: 500
  val_batches: 40
  checkpoint_every_steps: 2000
  keep_last_checkpoints: 3
  sample_every_steps: 2000
  seed: 1337
  dtype: bfloat16

sparsity:
  enabled: false
