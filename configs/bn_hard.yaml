# Hard TopK activation bottleneck, ordinary hard-mask backward.
# Identical architecture and forward to bn_lapsum.yaml -- the ONLY difference
# is that the J inactive candidates receive no gradient at all.
_base_:
  - model/mid80.yaml
  - train/default.yaml

train:
  run_name: bn_hard

activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32
  j: 480
  selection_mode: abs_topk
  surrogate_mode: hard
  # Under a stream placement the PyTorch-default init scales the decoder for
  # fan-in n_features though TopK delivers only k non-zeros: std(out)/std(in)
  # measures 0.128 at k=32, N=1536, and that attenuation compounds through
  # depth until the run collapses (docs/vastai-agent-guide.md section 9).
  init_mode: sqrt_k_selection_corrected
