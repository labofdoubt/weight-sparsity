# vi_cal_rs_k32_j32_t0p6: laplace_policy on the code-carried cell (32, 32).
# Base: configs/cr_kj/ma_cr_rbk_k32_j32_t2.yaml (code_residual: true, post_norm: false, the stable T=2 arm of
# docs/kj-vs-hard-topk-code-residual.tex), with the gate's training rule
# replaced -- every other field is the base file's (checked field by field by
# scripts/make_policy_cr_configs.py, which wrote this file):
#   activation_bottleneck.policy_temperature_mode: 'absolute' -> 'relative_span'
#   activation_bottleneck.rblapsum_boundary_grad_mode: 'through_rank_kappa' -> 'detach'
#   activation_bottleneck.surrogate_mode: 'rblapsum' -> 'laplace_policy'
#   activation_bottleneck.temperature: 2.0 -> 0.6
#   train.policy_val_samples: 1 -> 2
#   train.run_name: 'ma_cr_rbk_k32_j32_t2' -> 'vi_cal_rs_k32_j32_t0p6'
# Calibration probe: constant width, run with train_guard.py --stop-step.
model:
  vocab_size: 50257
  max_seq_len: 512
  n_layers: 8
  d_model: 768
  n_heads: 12
  mlp_ratio: 4.0
  mlp_activation: gelu
  dropout: 0.0
  attn_dropout: 0.0
  bias: false
  norm_eps: 1.0e-06
  tie_embeddings: true
  pos_encoding: rope
  rope_theta: 10000.0
  decouple: true
  decouple_gains: row_col
  bottleneck_init: standard
  bottleneck_decoder_scale: none
  md_init: false
  init_scheme: fixed_std
  init_std: 0.02
  init_gain: 1.0
  init_std_embedding: null
  init_std_pos: null
  init_std_unembedding: null
  init_scale_residual: true
  logit_scale: none
data:
  dataset: roneneldan/TinyStories
  data_dir: /workspace/data/tinystories
  seq_len: 512
  tokenizer: gpt_neo
  tokenizer_path: data/tinystories/tokenizer
  bpe_vocab_size: 8192
  bpe_train_docs: 200000
  num_proc: 8
  val_fraction: 0.0
train:
  optimizer: adamw
  lr: 0.0006
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  grad_clip: 1.0
  lr_schedule: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1
  batch_size: 96
  final_val_batches: 0
  micro_batch_size: 24
  max_steps: 20000
  log_every_steps: 20
  validate_every_steps: 500
  val_batches: 40
  checkpoint_every_steps: 2000
  keep_last_checkpoints: 3
  sample_every_steps: 2000
  sample_prompt: Once upon a time
  sample_tokens: 96
  sample_count: 4
  seed: 1337
  device: auto
  dtype: bfloat16
  compile: false
  out_dir: /workspace/runs
  run_name: vi_cal_rs_k32_j32_t0p6
  resume: ''
  wandb_project: ''
  wandb_entity: ''
  tensorboard: true
  policy_val_samples: 2
  policy_val_seed: 1337
  policy_train_deterministic_every_steps: 0
activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32
  j: 32
  selection_mode: abs_topk
  surrogate_mode: laplace_policy
  stochastic_width: none
  stochastic_width_param: 0.5
  temperature: 0.6
  policy_temperature_mode: relative_span
  policy_temperature_schedule: constant
  policy_temperature_final: null
  policy_temperature_hold_steps: 0
  policy_temperature_anneal_steps: 0
  policy_min_temperature: 1.0e-06
  policy_center_scores: true
  policy_baseline: ema
  policy_baseline_decay: 0.99
  policy_baseline_initial: null
  policy_support_scale: 1.0
  policy_support_scale_mode: constant
  policy_support_temperature_ref: 1.0
  policy_support_scale_max: null
  rblapsum_boundary_grad_mode: detach
  rblapsum_support_scale: 1.0
  rblapsum_rho_random_perm_prob_grad: 0.0
  rblapsum_surrogate_scope: pool
  rblapsum_carry_decay: 1.0
  rblapsum_relative_temperature: false
  rblapsum_kernel_width: fixed
  rblapsum_support_strength: null
  rblapsum_center_tokens: false
  rblapsum_sf_value_grad: pool
  post_norm: false
  rblapsum_boundary_floor: 0.0
  init_mode: default
  tie_encoder_decoder: false
  share_projections: false
  value_shift: none
  value_shift_lambda: null
  code_residual: true
  code_residual_scale: 1.0
  barrier_solver_tol: 1.0e-06
  solver_dtype: float32
  log_diagnostics: true
  bias: false
  hard_inference: true
