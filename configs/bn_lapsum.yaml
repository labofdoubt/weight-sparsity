# Hard TopK forward with the constant-temperature LapSum surrogate backward.
# Forward is bit-identical to bn_hard.yaml; the J candidates outside TopK
# receive the exact fixed-t barrier VJP (sum p_i = K).
_base_:
  - model/mid80.yaml
  - train/default.yaml

train:
  run_name: bn_lapsum

activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32
  j: 480
  selection_mode: abs_topk
  surrogate_mode: lapsum
  temperature: 1.0
