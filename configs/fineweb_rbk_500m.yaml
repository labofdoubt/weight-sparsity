# 24x1024 (~555M params with the bottleneck) on FineWeb-Edu sample-10BT,
# 8-GPU data parallel.  Launch:
#   NGPU=8 bash scripts/train_ddp.sh --config configs/fineweb_rbk_500m.yaml \
#       --train.run_name=<name> --activation_bottleneck.k=<K> --activation_bottleneck.j=<J>
# Variants used by the campaign:
#   hard Top-K':    --activation_bottleneck.surrogate_mode=hard --activation_bottleneck.k=<K'>
#   no bottleneck:  --activation_bottleneck.enabled=false
# Data: scripts/prepare_fineweb.py --out <data_dir> (50M-token holdout in val.bin;
# routine validation = val_batches deterministic-prefix batches ~ 5M tokens;
# final_val_batches scores the whole holdout once at the end).

model:
  n_layers: 24
  d_model: 1024
  n_heads: 16          # d_head = 64
  mlp_ratio: 4.0       # d_ff = 4096
  mlp_activation: gelu
  max_seq_len: 1024
  pos_encoding: rope
  vocab_size: 50257    # overwritten from meta.json at start
  bias: false
  dropout: 0.0
  decouple: true
  logit_scale: none

data:
  dataset: "HuggingFaceFW/fineweb-edu:sample-10BT"
  data_dir: /workspace/data/fineweb_edu_10bt
  seq_len: 1024
  tokenizer: gpt_neo

activation_bottleneck:
  enabled: true
  n_features: 4096
  k: 128
  j: 128
  layers: all
  placement: residual_out
  selection_mode: abs_topk
  surrogate_mode: rblapsum
  rblapsum_boundary_grad_mode: through_rank_kappa
  rblapsum_temperature: 1.0
  post_norm: true
  init_mode: sqrt_k_selection_corrected
  log_diagnostics: true

train:
  seed: 1337
  device: cuda
  dtype: bfloat16
  # PER-RANK: 64 seq x 1024 tok x 8 ranks = 524,288 tokens per optimizer step
  batch_size: 64
  micro_batch_size: 16      # grad accumulation 64/16 = 4 is derived
  # ~10B tokens / 0.52M tokens per step
  max_steps: 19000
  lr: 3.0e-4           # scaled down from 6e-4 at 114M; not swept
  warmup_steps: 380    # 2%
  lr_schedule: cosine
  min_lr_ratio: 0.1
  grad_clip: 1.0
  log_every_steps: 20
  validate_every_steps: 500
  # routine validation: 300 x 16 x 1025 tok ~ 4.9M of the 50M holdout (prefix)
  val_batches: 300
  # the full 50M holdout, once, after the last step
  final_val_batches: 3050
  checkpoint_every_steps: 2000
  keep_last_checkpoints: 3
  sample_every_steps: 0
  tensorboard: true
  out_dir: /workspace/runs
  run_name: fineweb_rbk_500m
