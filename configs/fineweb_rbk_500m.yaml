# ============================================================================
# Preliminary config for the FineWeb-Edu 500M campaign (8 x H100/H200, DDP).
#
# Model: 24 x 1024, d_head 64, d_ff 4096, GELU, RoPE, MD decoupling ->
# 353.5M base + 201.3M bottleneck (N=4096) = ~555M parameters.
# Data: FineWeb-Edu sample-10BT bins (scripts/prepare_fineweb.py output;
# on Drive under data/fineweb_edu_10bt): 50M-token document-aligned holdout
# in val.bin; routine validation = val_batches prefix (~4.9M tokens);
# final_val_batches scores the full holdout once at the end (val_final/ce).
#
# Launch (one 8-GPU job at a time; guard included):
#   NGPU=8 bash scripts/train_ddp.sh --config configs/fineweb_rbk_500m.yaml \
#     --train.run_name=<name> \
#     --activation_bottleneck.k=<K> --activation_bottleneck.j=<J>
# Arms:
#   rblapsum kappa + post-norm (this file's defaults)   -- the model under test
#   hard Top-K':   --activation_bottleneck.surrogate_mode=hard \
#                  --activation_bottleneck.k=<K'> --activation_bottleneck.j=64
#                  (j=64 is the hard-baseline convention of every earlier
#                  campaign: identical forward, keeps the gap/span diagnostics)
#   no bottleneck: --activation_bottleneck.enabled=false
#
# Deliberately undecided until the smoke run on the rented box:
#   * micro_batch_size: settled by the smoke -- 32 (see train block).
#   * lr: 3e-4 is the standard 350-760M-class value and NOT swept; optional
#     3-point probe (2e-4 / 3e-4 / 4.5e-4, ~1.5B tokens each) before launch.
#
# Checkpoint/egress policy (guide 9c): local cadence below is for crash
# recovery; the ckpt WATCHER uploads latest.pt on a 7200 s cycle
# (--checkpoints-only), so >= 1 checkpoint per 2 h reaches Drive and
# intermediate ckpt_step*.pt stay local-only.
# ============================================================================

model:
  n_layers: 24
  d_model: 1024
  n_heads: 16          # d_head = 64
  mlp_ratio: 4.0       # d_ff = 4096
  mlp_activation: gelu
  max_seq_len: 1024
  pos_encoding: rope
  vocab_size: 50257    # overwritten from meta.json at start
  bias: false
  dropout: 0.0
  decouple: true       # MD everywhere, all arms: weight decay replaced by the sphere
  logit_scale: none

data:
  dataset: "HuggingFaceFW/fineweb-edu:sample-10BT"
  data_dir: /workspace/data/fineweb_edu_10bt
  seq_len: 1024
  tokenizer: gpt_neo

activation_bottleneck:
  enabled: true
  bias: false          # family convention (every 114M campaign); the dataclass
                       # default is true and slipped into the first 500M runs
  n_features: 4096     # 4x expansion; 2 x d x N x L = 201.3M params
  k: 128               # set per cell at launch
  j: 128               # set per cell at launch
  layers: all
  placement: residual_out
  selection_mode: abs_topk
  surrogate_mode: rblapsum
  rblapsum_boundary_grad_mode: through_rank_kappa
  temperature: 1.0     # post-norm variant runs T=1 (stabilization note)
  post_norm: true
  init_mode: sqrt_k_selection_corrected
  log_diagnostics: true

train:
  seed: 1337
  device: cuda
  dtype: bfloat16
  # PER-RANK: 64 seq x 1024 tok; x8 ranks = 524,288 tokens per optimizer step
  batch_size: 64
  # Measured on 8xH200 (smoke, 2026-09-28): micro 32 -> 448K tok/s, ~65 GB/GPU;
  # micro 16 -> 414K tok/s; micro 64 OOMs even at 141 GB (the N=4096 codes
  # dominate activations).  Grad accumulation 64/32 = 2 is derived.
  micro_batch_size: 32
  # compile=true measured +37% (614K vs 448K tok/s) with losses matching
  # eager at a 50-step probe, but eval/resume paths are unexercised under
  # compile and the topk gate has a documented compiled-vs-eager numeric
  # mismatch -- DISABLED by decision 2026-09-28; revisit if run time binds.
  compile: false
  # 19,000 steps x 0.52M tokens ~ 10.0B tokens = one pass over sample-10BT
  max_steps: 19000
  lr: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  warmup_steps: 500             # ~2.6%, ~260M tokens
  lr_schedule: cosine
  min_lr_ratio: 0.1
  grad_clip: 1.0
  log_every_steps: 20
  validate_every_steps: 500
  val_batches: 300              # routine: 300 x 16 x 1025 ~ 4.9M-token prefix
  final_val_batches: 3050       # the full 50M holdout, once, at the end
  checkpoint_every_steps: 2000  # local recovery cadence (~18 min at 0.55 s/step)
  keep_last_checkpoints: 3
  sample_every_steps: 0
  tensorboard: true
  out_dir: /workspace/runs
  run_name: fineweb_rbk_500m    # overridden per run at launch
