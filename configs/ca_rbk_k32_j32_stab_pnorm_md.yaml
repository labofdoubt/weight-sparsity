# Reproduction of the california run
#   ca_rout_rblapsum_kappa_k32_j32_stab_pnorm_md_abs
# on the post-2026-09-28-cleanup schema.
#
# Generated by migrating that run's archived config.json through
# `wsparse.config.config_from_dict` and dumping it: every field the cleanup
# kept matches the archived value exactly (verified field by field), and the
# fields it dropped were all inert in that run --
#
#   n_eff / effective_count_metric / boundary_mode / one_sided_weight_mode
#       read only by the removed adaptive temperature, never by rblapsum
#   temperature_* (constant, absolute, start 1.0)
#       rblapsum read `rblapsum_temperature: 1.0`, which is now `temperature`
#   rblapsum_temperature_mode: fixed, servo fields
#       the servo was off
#   reconstruction_coef 0.0, calibrate_output false,
#   surrogate_grad_scale 1.0, inactive_grad_scale 1.0,
#   project_scale_gradient false, swap/jumprelu/reinforce defaults
#       all neutral
#
# and the fields added since are at their neutral defaults
# (`rblapsum_support_scale: 1.0`, `rblapsum_rho_random_perm_prob_grad: 0.0`).
#
# Deliberately self-contained rather than `_base_`-composed: it has to pin what
# the archived run actually used, not track today's defaults.  `init_mode` is
# `default` because that run used it -- do not "fix" it here.
#
#   NGPU=1 python scripts/train_guard.py \
#       --config configs/ca_rbk_k32_j32_stab_pnorm_md.yaml
#
# Same seed (1337) as the original, so the two curves are directly comparable;
# bf16 matmuls are not bit-reproducible across GPU architectures, so expect
# them to track each other rather than coincide exactly.

model:
  vocab_size: 50257
  max_seq_len: 512
  n_layers: 8
  d_model: 768
  n_heads: 12
  mlp_ratio: 4.0
  mlp_activation: gelu
  dropout: 0.0
  attn_dropout: 0.0
  bias: false
  norm_eps: 1.0e-06
  tie_embeddings: true
  pos_encoding: rope
  rope_theta: 10000.0
  decouple: true            # MD: fixed-norm directions + row/col gains
  decouple_gains: row_col
  md_init: false
  init_scheme: fixed_std
  init_std: 0.02
  init_gain: 1.0
  init_std_embedding: null
  init_std_pos: null
  init_std_unembedding: null
  init_scale_residual: true
  logit_scale: none         # required by decouple

data:
  dataset: roneneldan/TinyStories
  data_dir: /workspace/data/tinystories
  seq_len: 512
  tokenizer: gpt_neo
  tokenizer_path: data/tinystories/tokenizer
  bpe_vocab_size: 8192
  bpe_train_docs: 200000
  num_proc: 8
  val_fraction: 0.0

train:
  optimizer: adamw
  lr: 6.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-08
  weight_decay: 0.1         # ignored under decouple, kept as archived
  grad_clip: 1.0
  lr_schedule: cosine
  warmup_steps: 500
  min_lr_ratio: 0.1
  batch_size: 96
  micro_batch_size: 24
  final_val_batches: 0
  max_steps: 20000
  log_every_steps: 20
  validate_every_steps: 500
  val_batches: 40
  checkpoint_every_steps: 2000
  keep_last_checkpoints: 3
  sample_every_steps: 2000
  sample_prompt: Once upon a time
  sample_tokens: 96
  sample_count: 4
  seed: 1337
  device: auto
  dtype: bfloat16
  compile: false
  out_dir: /workspace/runs
  run_name: os_rbk_k32_j32_stab_pnorm_md
  resume: ''
  tensorboard: true

activation_bottleneck:
  enabled: true
  layers: all
  placement: residual_out
  n_features: 1536
  k: 32
  j: 32
  selection_mode: abs_topk
  surrogate_mode: rblapsum
  temperature: 1.0                             # was rblapsum_temperature
  rblapsum_boundary_grad_mode: through_rank_kappa
  rblapsum_support_scale: 1.0
  rblapsum_rho_random_perm_prob_grad: 0.0
  rblapsum_sf_value_grad: pool                 # sf-only, inert here
  post_norm: true
  rblapsum_boundary_floor: 0.0
  init_mode: default
  tie_encoder_decoder: false
  barrier_solver_tol: 1.0e-06
  solver_dtype: float32
  log_diagnostics: true
  bias: false
  hard_inference: true
