# AbsTopK_k(exp(g) * x) with the hard backward: g receives a gradient through
# the active entries only.  topk.j (the pool width beyond k that a DUST run
# perturbs) is left at null: 0 here, the whole input under dust.
_base_: [base.yaml]
train:
  run_name: topk_hard
rescale:
  enabled: true
topk:
  enabled: true
  k: 64
  surrogate_mode: hard
