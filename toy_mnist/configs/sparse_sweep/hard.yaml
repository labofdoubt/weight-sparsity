# Sparse-W0 study (2026-10-26): site_sweep/pre_linear.yaml
# (z = W2 relu(W1 AbsTopK_K(W0 x)), no rescaling, hidden 1024, 5000 steps,
# hard backward) with W0 projected to S entries of largest magnitude per row
